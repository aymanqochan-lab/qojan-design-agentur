<style id="wb-css">
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#f6f3ee;--panel:#fffdf9;--ink:#1d1a17;--mute:#6b645c;--line:#e5ddd2;--accent:#d9622b;--accent-ink:#fff;--good:#2f8a4f;--screen:#120f0d;--on-screen:#fff8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120f;--panel:#1f1b17;--ink:#f4ede4;--mute:#a59a8e;--line:#352e27;--accent:#e8743a;--good:#5cc483}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}

label.f input,label.f textarea,label.f select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:15px;min-width:0}
textarea{resize:vertical;min-height:64px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;display:grid;grid-template-columns:200px 1fr;gap:14px}
@media (max-width:640px){.card{grid-template-columns:1fr}}
.thumb{aspect-ratio:16/9;border-radius:10px;background:var(--bg) center/cover;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-size:13px;cursor:pointer;position:relative;overflow:hidden}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--mute)}
.ok{color:var(--good);font-weight:600}
.bar{position:sticky;bottom:12px;margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.howto{counter-reset:s;list-style:none;padding:0;margin:0}

.howto li:before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:13px;text-decoration:underline}
/* TV */
.nophoto .photo{background:radial-gradient(circle at 75% 40%,#5a2410 0%,#1a120d 60%)!important}.nophoto .shade{background:none}.nophoto .offer{width:calc(var(--u)*70)}
.week{position:absolute;right:calc(var(--u)*3);top:12vh;width:calc(var(--u)*36);background:rgba(255,248,240,.06);border:1px solid rgba(255,248,240,.14);border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1.6) calc(var(--u)*1.8);color:#fff8f0}.week .wt{font-family:'Bricolage Grotesque';font-weight:800;font-size:calc(var(--u)*1.9);margin-bottom:.8vw;color:#ffb98a}.wd{display:grid;grid-template-columns:calc(var(--u)*5) 1fr;gap:calc(var(--u)*1);padding:.7vw 0;border-top:1px solid rgba(255,248,240,.1);font-size:calc(var(--u)*1.15);opacity:.7}.wd.now{opacity:1;color:#fff;font-size:calc(var(--u)*1.3)}.wd.now b{color:#e8743a}.badge{display:inline-flex;align-items:center;gap:.6em;background:rgba(232,116,58,.16);border:1px solid rgba(232,116,58,.5);color:#ffb98a;border-radius:999px;padding:.35em 1em;font-size:calc(var(--u)*1.15);font-weight:600;width:max-content}

:root[data-theme="light"] .tv{--screen:#f7f1e8;--on-screen:#1d1a17}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.slide.show{opacity:1}
.photo{position:absolute;inset:0;background:center/cover}
.slide.show .photo{animation:kb 14s ease-out forwards}

.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,6,.92) 0%,rgba(10,8,6,.7) 38%,rgba(10,8,6,0) 70%)}

.qr{background:#fff;padding:.6vw;border-radius:.8vw;line-height:0}

.dist{display:flex;align-items:baseline;gap:calc(var(--u)*1);flex-wrap:wrap}

.dist .lbl{font-size:calc(var(--u)*1.6);opacity:.85}

.open{color:#5cc483;font-weight:600}.closed{color:#ff8a7a;font-weight:600}
.review{font-size:calc(var(--u)*1.35)!important;border-left:.35vw solid var(--accent);padding:.4vh 0 .4vh calc(var(--u)*1.6);font-size:calc(var(--u)*1.55);font-style:italic;max-width:calc(var(--u)*46)}
.review cite{display:block;font-style:normal;font-size:.75em;opacity:.65;margin-top:.5em}
.stars{color:#f5b301;letter-spacing:.15em;font-style:normal}
.qrbox{display:flex;align-items:center;gap:calc(var(--u)*1.4)}
.qrbox .qr{width:min(calc(var(--u)*9),16vh);flex:none}
.qrbox p{margin:0;font-size:calc(var(--u)*1.35);max-width:calc(var(--u)*20)}
.qrbox b{font-size:calc(var(--u)*1.7);display:block}
.hud{position:absolute;top:3vh;right:calc(var(--u)*3);left:calc(var(--u)*3);display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:calc(var(--u)*1.15);pointer-events:none}
.brand{display:flex;align-items:center;gap:.7vw;background:rgba(18,15,13,.6);color:#fff8f0;padding:.5vw calc(var(--u)*1);border-radius:999px;backdrop-filter:blur(6px)}
.brand .lg{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:50%;margin:-.3vw 0 -.3vw -.6vw}.brand{font-size:calc(var(--u)*1.25)}
.dot{width:.7vw;height:.7vw;border-radius:50%;background:#e8743a;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.peak{background:#e8743a;color:#fff;padding:.5vw calc(var(--u)*1.2);border-radius:999px;font-weight:600}
.prog{position:absolute;left:0;bottom:0;height:.5vh;background:var(--accent);z-index:6}
.picker{min-height:100vh;display:grid;place-items:center;text-align:center;padding:4vh calc(var(--u)*4)}
.picker h1{font-size:calc(var(--u)*4)}.picker p{font-size:calc(var(--u)*1.6);opacity:.75}
.pick{display:block;width:min(calc(var(--u)*60),700px);margin:1.4vh auto;padding:2.2vh;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:inherit;font-size:calc(var(--u)*2);cursor:pointer}
.pick:focus,.pick:hover{border-color:var(--accent);background:rgba(232,116,58,.2)}
.tvctl{position:absolute;bottom:2vh;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){.slide.show .photo,.slide.show .price,.slide.show .rise,.dot{animation:none!important;opacity:1;transform:none}}
</style>

  function f(h,mm){return ('0'+h).slice(-2)+':'+(mm||'00')}S.rest.hours[d]=m?[f(m[1],m[2]),f(m[3],m[4])]:null;markDirty()}});

function alertNote(el,msg){var n=el.parentNode.querySelector('.err');if(!n){n=document.createElement('div');n.className='err note';n.style.color='#d9483b';el.parentNode.appendChild(n)}n.textContent=msg}

function gh(path,opt){opt=opt||{};opt.headers={'Authorization':'Bearer '+tok(),'Accept':'application/vnd.github+json'};return fetch('https://api.github.com/repos/'+REPO+'/contents/'+DIR+path+(opt.method?'':'?t='+Date.now()),opt).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.message||r.status);e.status=r.status;throw e}return j})})}
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
function putFile(path,b64,msg){return gh(path).then(function(j){return j.sha},function(e){if(e.status===404)return null;throw e}).then(function(sha){var body={message:msg,content:b64};if(sha)body.sha=sha;return gh(path,{method:'PUT',body:JSON.stringify(body)})})}
function save(){var s=document.getElementById('savestate');if(!tok()){s.textContent=U('notok');var k=document.getElementById('tokin');if(k)k.focus();return}
 s.textContent=U('saving');var D=JSON.parse(JSON.stringify(S)),chain=Promise.resolve();
 D.offers.forEach(function(o){if(o.image&&o.image.indexOf('data:')===0){var name='img/'+o.id+'-'+Date.now()+'.jpg',b=o.image.split(',')[1],ti=o.title;chain=chain.then(function(){return putFile(name,b,'Weekboard: photo for '+ti)});o.image=name}});
 chain.then(function(){return putFile('data.json',b64utf8(JSON.stringify(D,null,1)),'Weekboard: update offers')}).then(function(){S=D;dirty=false;s.innerHTML='<span class="ok">'+U('savedok')+'</span>'}).catch(function(e){s.textContent=(e.status===401||e.status===403)?U('badtok'):U('fail')+' ('+e.message+')'})}

 '<button class="btn pri" id="gplay" style="width:100%">Visa hur det ser ut på tv:n</button>'+(editor?'<button class="btn" id="gback" style="width:100%;margin-top:10px">Back to studio</button>':'')+'</div>';
